name: Replay workflow plan
description: Materialize declared outputs from a replay decision

inputs:
  output-root:
    description: Directory that receives one JSON file per declared output role
    required: true
  plan:
    description: Absolute path to the sealed workflow plan
    required: true

runs:
  using: composite
  steps:
    - name: Replay sealed workflow plan
      shell: bash
      run: >-
        node --experimental-strip-types .github/scripts/workflow.ts replay
        --plan "${{ inputs.plan }}"
        --output-root "${{ inputs.output-root }}"
