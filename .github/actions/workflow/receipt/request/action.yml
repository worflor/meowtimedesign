name: Request workflow receipt
description: Capture declared outputs and upload one trusted-writer receipt request

inputs:
  artifact:
    description: Unique receipt request artifact name
    required: true
  input-root:
    description: Directory containing one JSON file per declared output role
    required: true
  plan:
    description: Absolute path to the sealed workflow plan
    required: true
  request-root:
    description: Directory containing the plan and receiving result.json
    required: true

runs:
  using: composite
  steps:
    - name: Capture declared workflow outputs
      shell: bash
      run: >-
        node --experimental-strip-types .github/scripts/workflow.ts capture
        --plan "${{ inputs.plan }}"
        --input-root "${{ inputs.input-root }}"
        --output "${{ inputs.request-root }}/result.json"
    - name: Upload workflow receipt request
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.request-root }}
        if-no-files-found: error
        retention-days: 1
