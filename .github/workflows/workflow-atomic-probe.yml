name: workflow-atomic-probe

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: "Optional probe label; the run identity keeps every probe isolated."
        required: false
        type: string
        default: manual

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.ref_name == 'feat/standalone-closure' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
      RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
      RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
      RELEASE_STORAGE_REGION: auto
      RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
      WORKFLOW_RECEIPT_PREFIX: workflow-experiments/v1/standalone-closure/atomic-probe
    steps:
      - name: Checkout probe controller
        uses: actions/checkout@v6.0.2

      - name: Self-check atomic controller
        run: node --experimental-strip-types .github/scripts/workflow.ts self-check

      - name: Prepare probe inputs
        uses: actions/github-script@v8
        env:
          PROBE_NONCE: ${{ inputs.nonce }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");
            const root = path.join(process.env.RUNNER_TEMP, "workflow-atomic-probe");
            fs.mkdirSync(root, { recursive: true });
            const digest = (value) => `sha256:${crypto.createHash("sha256").update(value).digest("hex")}`;
            fs.writeFileSync(path.join(root, "extras.json"), JSON.stringify({
              nonce: digest(`${process.env.PROBE_NONCE}:${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}`),
            }));
            fs.writeFileSync(path.join(root, "result.json"), JSON.stringify({
              outputs: {
                proof: {
                  runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                  runId: process.env.GITHUB_RUN_ID,
                  status: "executed",
                },
              },
            }));

      - name: Resolve cold probe
        id: cold
        run: |
          node --experimental-strip-types .github/scripts/workflow.ts resolve \
            --action experiment.atomic-probe \
            --extras "$RUNNER_TEMP/workflow-atomic-probe/extras.json" \
            --github-output-prefix cold \
            --output "$RUNNER_TEMP/workflow-atomic-probe/cold-plan.json"

      - name: Execute probe atom
        if: ${{ steps.cold.outputs.cold_decision == 'execute' }}
        run: echo "The probe executor ran exactly once."

      - name: Commit isolated receipt
        if: ${{ steps.cold.outputs.cold_decision == 'execute' }}
        run: |
          node --experimental-strip-types .github/scripts/workflow.ts commit \
            --plan "$RUNNER_TEMP/workflow-atomic-probe/cold-plan.json" \
            --result "$RUNNER_TEMP/workflow-atomic-probe/result.json" \
            --output "$RUNNER_TEMP/workflow-atomic-probe/commit.json"

      - name: Resolve warm probe
        id: warm
        run: |
          node --experimental-strip-types .github/scripts/workflow.ts resolve \
            --action experiment.atomic-probe \
            --extras "$RUNNER_TEMP/workflow-atomic-probe/extras.json" \
            --github-output-prefix warm \
            --output "$RUNNER_TEMP/workflow-atomic-probe/warm-plan.json"

      - name: Resolve verify probe
        id: verify
        run: |
          node --experimental-strip-types .github/scripts/workflow.ts resolve \
            --action experiment.atomic-probe \
            --extras "$RUNNER_TEMP/workflow-atomic-probe/extras.json" \
            --mode verify \
            --github-output-prefix verify \
            --output "$RUNNER_TEMP/workflow-atomic-probe/verify-plan.json"

      - name: Assert atomic lifecycle
        uses: actions/github-script@v8
        env:
          COLD_DECISION: ${{ steps.cold.outputs.cold_decision }}
          COLD_HANDLE: ${{ steps.cold.outputs.cold_handle }}
          VERIFY_DECISION: ${{ steps.verify.outputs.verify_decision }}
          VERIFY_REASON: ${{ steps.verify.outputs.verify_reason }}
          WARM_DECISION: ${{ steps.warm.outputs.warm_decision }}
          WARM_HANDLE: ${{ steps.warm.outputs.warm_handle }}
          WARM_REASON: ${{ steps.warm.outputs.warm_reason }}
        with:
          script: |
            const expected = {
              COLD_DECISION: "execute",
              VERIFY_DECISION: "execute",
              VERIFY_REASON: "verify",
              WARM_DECISION: "replay",
              WARM_REASON: "receipt-hit",
            };
            for (const [name, value] of Object.entries(expected)) {
              if (process.env[name] !== value) core.setFailed(`${name} expected ${value}, received ${process.env[name]}`);
            }
            if (process.env.COLD_HANDLE !== process.env.WARM_HANDLE) {
              core.setFailed("resolve and replay did not share one sealed handle");
            }
            await core.summary
              .addHeading("Atomic workflow probe", 2)
              .addTable([
                [{ data: "Phase", header: true }, { data: "Decision", header: true }, { data: "Reason", header: true }],
                ["Cold", process.env.COLD_DECISION, "receipt-miss"],
                ["Warm", process.env.WARM_DECISION, process.env.WARM_REASON],
                ["Verify", process.env.VERIFY_DECISION, process.env.VERIFY_REASON],
              ])
              .addRaw(`\nHandle: \`${process.env.COLD_HANDLE}\`\n`)
              .write();
